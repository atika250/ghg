<!-- ... existing code ... -->
    <footer class="bg-slate-800 text-slate-300 py-6 text-center text-sm border-t border-slate-700 mt-auto">
        <p>&copy; 2026 Campus Sustainability Office. Dashboard generated for analysis.</p>
        <p class="mt-1 text-xs text-slate-400">Values based on "Inventori GHG untuk kampus danpengiraan data pelepasan karbon (3).xlsx".</p>
    </footer>

    <script>
        let scopeChart, sourceChart, intensityChart, trendChart;

        Chart.defaults.font.family = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
        Chart.defaults.color = '#64748b'; 

        async function loadLiveExcelData() {
            // TUKAR: Guna output=xlsx untuk muat turun keseluruhan buku kerja (termasuk 2025 & 2026)
            const excelUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzhnSufRXiSZQN1RnsKwmLR6ItonxmI4ag7Zevfw4t7y5_7u3poVW0lDpc6rR2xQ/pub?output=xlsx';
            
            try {
                const response = await fetch(excelUrl);
                const arrayBuffer = await response.arrayBuffer();
                // Baca fail excel menggunakan SheetJS
                const workbook = XLSX.read(arrayBuffer, {type: 'array'});
                
                processWorkbook(workbook);
            } catch (error) {
                console.error("Ralat membaca Excel:", error);
                alert("Tidak dapat mengambil data. Sila pastikan pautan Google Sheets adalah betul.");
            }
        }

        function extractDataFromSheet(rows) {
            let headerRowIndex = -1;
            // 1. Cari baris tajuk
            for(let i=0; i<rows.length; i++) {
                if(rows[i] && rows[i].some(val => typeof val === 'string' && val.toLowerCase().includes('bangunan'))) {
                    headerRowIndex = i;
                    break;
                }
            }

            if (headerRowIndex === -1) return null;

            const headers = rows[headerRowIndex].map(h => h ? String(h).toLowerCase() : '');
            const bangunanIdx = headers.findIndex(h => h.includes('bangunan'));
            
            let jumlahIdx = -1;
            for(let i = headers.length - 1; i >= 0; i--) {
                if(headers[i] && headers[i].includes('jumlah') && !headers[i].includes('lantai')) {
                    jumlahIdx = i;
                    break;
                }
            }
            
            const pelepasanIdx = headers.findIndex(h => h.includes('pelepasan'));
            const intensitiIdx = headers.findIndex(h => h.includes('kwh/m'));
            
            const months = ['jan', 'feb', 'mac', 'apr', 'mei', 'jun', 'jul', 'ogos', 'sept', 'okt', 'nov', 'dis'];
            const monthIndices = months.map(m => headers.findIndex(h => h && h.match(new RegExp(`\\b${m}\\b`, 'i'))));

            let bangunanData = [];
            let monthlyTotals = new Array(12).fill(0);
            let grandTotalKwh = 0;
            let grandTotalCO2 = 0;

            for(let i = headerRowIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length <= bangunanIdx) continue;
                
                const nama = row[bangunanIdx];
                if (!nama || String(nama).trim() === '') continue;
                if (String(nama).toLowerCase().includes('jumlah')) break; 

                const cleanNum = (val) => {
                    if(!val) return 0;
                    let num = parseFloat(String(val).replace(/,/g, ''));
                    return isNaN(num) ? 0 : num;
                };

                const jumlahKwh = cleanNum(row[jumlahIdx]);
                const pelepasan = cleanNum(row[pelepasanIdx]);
                const intensiti = cleanNum(row[intensitiIdx]);

                if (jumlahKwh > 0 || pelepasan > 0) {
                    bangunanData.push({ name: String(nama), kwh: jumlahKwh, co2: pelepasan, intensiti: intensiti });
                    grandTotalKwh += jumlahKwh;
                    grandTotalCO2 += pelepasan;

                    monthIndices.forEach((colIdx, mIdx) => {
                        if (colIdx !== -1 && row[colIdx] !== undefined) {
                            monthlyTotals[mIdx] += cleanNum(row[colIdx]);
                        }
                    });
                }
            }
            return { monthlyTotals, bangunanData, grandTotalCO2 };
        }

        function processWorkbook(workbook) {
            const sheetNames = workbook.SheetNames;
            // Secara automatik kenal pasti sheet mana mewakili 2025 dan 2026
            const sheet2025Name = sheetNames.find(n => n.includes('2025')) || sheetNames[0];
            const sheet2026Name = sheetNames.find(n => n.includes('2026')) || sheetNames[1] || sheetNames[0];

            const rows2025 = XLSX.utils.sheet_to_json(workbook.Sheets[sheet2025Name], {header: 1, defval: null});
            const rows2026 = XLSX.utils.sheet_to_json(workbook.Sheets[sheet2026Name], {header: 1, defval: null});

            const data2025 = extractDataFromSheet(rows2025);
            const data2026 = extractDataFromSheet(rows2026);

            if (!data2025 || !data2026) return;

            // Kemas kini KPI 
            if(data2025.grandTotalCO2 > 0) {
                document.getElementById('total-emissions').innerText = new Intl.NumberFormat().format(Math.round(data2025.grandTotalCO2));
                document.getElementById('per-capita').innerText = (data2025.grandTotalCO2 / 5000).toFixed(2);
            }

            const top5Kwh = [...data2025.bangunanData].sort((a, b) => b.kwh - a.kwh).slice(0, 5);
            const top5Intensiti = [...data2025.bangunanData].sort((a, b) => b.intensiti - a.intensiti).slice(0, 5);

            renderCharts(top5Kwh, top5Intensiti, data2025.monthlyTotals, data2026.monthlyTotals, data2025.grandTotalCO2);
        }

        function renderCharts(top5Kwh, top5Intensiti, monthly2025, monthly2026, grandTotalCO2) {
            const truncateLabel = (label) => label.length > 25 ? label.substring(0, 25) + '...' : label;

            // --- 1. Scope Chart ---
            const ctxScope = document.getElementById('scopeChart').getContext('2d');
            if (scopeChart) scopeChart.destroy();
            scopeChart = new Chart(ctxScope, {
                type: 'doughnut',
                data: {
                    labels: ['Scope 2 (Electricity) - Tracked', 'Unmetered/Untracked'],
                    datasets: [{
                        data: [grandTotalCO2, grandTotalCO2 * 0.10],
                        backgroundColor: ['#10b981', '#cbd5e1'],
                        borderWidth: 2, borderColor: '#ffffff', hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '65%',
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true, boxWidth: 8 } },
                        tooltip: { callbacks: { label: (context) => {
                            let label = context.label || '';
                            if (label) label += ': ';
                            if (context.parsed !== null) label += new Intl.NumberFormat().format(Math.round(context.parsed)) + ' tCO₂e';
                            return label;
                        }}}
                    }
                }
            });

            // --- 2. Source Breakdown Chart ---
            const ctxSource = document.getElementById('sourceChart').getContext('2d');
            if (sourceChart) sourceChart.destroy();
            sourceChart = new Chart(ctxSource, {
                type: 'bar',
                data: {
                    labels: top5Kwh.map(d => truncateLabel(d.name)),
                    datasets: [{
                        label: 'Energy Consumption (kWh)',
                        data: top5Kwh.map(d => d.kwh),
                        backgroundColor: '#10b981', borderRadius: 4, barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (context) => `${new Intl.NumberFormat().format(context.parsed.x)} kWh` } } },
                    scales: {
                        x: { grid: { color: '#f1f5f9' }, title: { display: true, text: 'kWh' }, ticks: { callback: (value) => value >= 1000 ? value / 1000 + 'k' : value } },
                        y: { grid: { display: false } }
                    }
                }
            });

            // --- 3. Energy Intensity Chart ---
            const ctxIntensity = document.getElementById('intensityChart').getContext('2d');
            if (intensityChart) intensityChart.destroy();
            intensityChart = new Chart(ctxIntensity, {
                type: 'bar',
                data: {
                    labels: top5Intensiti.map(d => truncateLabel(d.name)),
                    datasets: [{
                        label: 'Energy Intensity (kWh/m²)',
                        data: top5Intensiti.map(d => d.intensiti),
                        backgroundColor: '#0ea5e9', borderRadius: 4, barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (context) => `${new Intl.NumberFormat().format(context.parsed.x)} kWh/m²` } } },
                    scales: {
                        x: { grid: { color: '#f1f5f9' }, title: { display: true, text: 'kWh/m²' }, ticks: { callback: (value) => value >= 1000 ? value / 1000 + 'k' : value } },
                        y: { grid: { display: false } }
                    }
                }
            });

            // --- 4. Trend Chart (Dwi-Garisan 2025 vs 2026) ---
            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();
            
            // Bersihkan sifar untuk paparan carta yang kemas
            const cleanMonthly2025 = monthly2025.map(val => val === 0 ? null : val);
            const cleanMonthly2026 = monthly2026.map((val, idx) => {
                if (val === 0 && idx >= 6) return null; // Jika bulan Julai ke atas masih sifar, jadikan kosong
                return val === 0 ? null : val;
            });

            trendChart = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogos', 'Sept', 'Okt', 'Nov', 'Dis'],
                    datasets: [
                        {
                            label: '2026 (Terkini)',
                            data: cleanMonthly2026,
                            borderColor: '#10b981', // Hijau Terang
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2, pointBackgroundColor: '#10b981', pointBorderColor: '#fff',
                            fill: true, tension: 0.4 
                        },
                        {
                            label: '2025 (Tahun Lepas)',
                            data: cleanMonthly2025,
                            borderColor: '#94a3b8', // Kelabu
                            backgroundColor: 'transparent',
                            borderWidth: 2, borderDash: [5, 5], // Garisan putus-putus
                            pointBackgroundColor: '#94a3b8', pointBorderColor: '#fff',
                            fill: false, tension: 0.4 
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 8 } } },
                    scales: {
                        x: { grid: { display: false } },
                        y: { grid: { color: '#f1f5f9' }, beginAtZero: true, title: { display: true, text: 'Tenaga Digunakan (kWh)' } }
                    }
                }
            });
        }

        window.onload = function() {
            loadLiveExcelData();
        };
    </script>
</body>
